version: '3.8'
services:
  extractor_daily:
    build:
      context: .
      dockerfile: docker/extractor.dockerfile
    container_name: typack_extractor_daily
    command: python src/typack_etl/extractor/pipelines/extractor_daily.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Santiago
    restart: unless-stopped

  extractor_30m:
    build:
      context: .
      dockerfile: docker/extractor.dockerfile
    container_name: typack_extractor_30m
    command: python src/typack_etl/extractor/pipelines/extractor_30m.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Santiago
    restart: unless-stopped

  extractor_mensual:
    build:
      context: .
      dockerfile: docker/extractor.dockerfile
    container_name: typack_extractor_mensual
    command: python src/typack_etl/extractor/pipelines/extractor_mensual.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Santiago
    restart: unless-stopped

  transformer:
    build:
      context: .
      dockerfile: docker/transformer.dockerfile
    container_name: typack_transformer
    command: python src/typack_etl/transformer/pipelines/transformer.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Santiago
    restart: unless-stopped
